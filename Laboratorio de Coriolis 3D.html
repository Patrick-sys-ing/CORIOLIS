<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de Coriolis 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0f172a;--glass:rgba(15,23,42,.58);--line:rgba(148,163,184,.28);--cy:#38bdf8;--or:#f97316;--yl:#fbbf24;--tx:#e2e8f0;--mu:#94a3b8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
.hud{position:fixed;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.4)}
#ctrl{left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:316px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
#modes{right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:6px}
#read{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:300px}
h1{font-size:1.05rem;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
summary{cursor:pointer;font-weight:800;list-style:none}
summary::-webkit-details-marker{display:none}
h2{font-size:.78rem;font-weight:600;color:var(--cy);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
label{display:block;font-size:.8rem;font-weight:600;margin:7px 0 0}
label output{float:right;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78rem;color:var(--cy)}
input[type=range]{width:100%;accent-color:var(--cy);margin:2px 0}
input[type=number]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:4px 6px;font:inherit}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;margin:6px 0}
.chk input{accent-color:var(--or);width:16px;height:16px}
button{font:inherit;font-weight:600;font-size:.82rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);cursor:pointer}
button.p{background:var(--cy);color:#06202e;border-color:var(--cy)}
button[aria-pressed="true"]{background:var(--cy);color:#06202e;border-color:var(--cy)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--yl);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.78rem}
.kv span:nth-child(even){font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;text-align:right}
.lg{display:flex;gap:10px;font-size:.72rem;color:var(--mu);margin:8px 0 0;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#hint{font-size:.76rem;color:var(--mu);margin:6px 0 0}
#err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
[hidden]{display:none!important}
@media (max-width:760px){
#ctrl{top:auto;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:42%}
#read{top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;width:210px;padding:8px 10px}
.lg,#hint{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="err" hidden>No se pudo cargar Three.js. Revisa tu conexión a internet.</div>

<aside class="hud" id="ctrl">
<details open id="det">
<summary><h1>Laboratorio de Coriolis 3D</h1></summary>
<div id="sliders"></div>
<h2>Fuerzas ficticias (comparar)</h2>
<label class="chk"><input type="checkbox" id="kC" checked> Aceleración de Coriolis</label>
<label class="chk"><input type="checkbox" id="kF" checked> Aceleración centrífuga</label>
<div class="row">
<button class="p" id="bFire">Disparar</button>
<button id="bPause" aria-pressed="false">Pausar</button>
<button id="bReset">Reiniciar</button>
<button id="bFlip">Invertir ω</button>
</div>
<h2>Calculadora en la Tierra</h2>
<label>Latitud φ (°)<input type="number" id="eLat" value="45" min="-90" max="90"></label>
<label>Rapidez v (m/s)<input type="number" id="eV" value="250" min="0"></label>
<p id="eOut" class="kv" style="margin-top:8px"></p>
</details>
</aside>

<div class="hud" id="modes" role="group" aria-label="Modo de cámara">
<button id="mRot" aria-pressed="true">Sistema rotante</button>
<button id="mIn" aria-pressed="false">Inercial</button>
</div>

<aside class="hud" id="read">
<div class="kv" id="kv"></div>
<div class="lg"><span><i style="background:var(--cy)"></i>velocidad</span><span><i style="background:var(--or)"></i>Coriolis</span><span><i style="background:var(--yl)"></i>centrífuga</span></div>
<p id="hint"></p>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE||!THREE.OrbitControls){document.getElementById("err").hidden=false;return;}
THREE.Object3D.DefaultUp.set(0,0,1); // Z hacia arriba, como en el planteamiento físico

/* =====================================================================
   1. FÍSICA  (marco rotante, eje de giro = Z)
   Segunda ley en el marco no inercial:
     a_rel = F/m − 2 ω×v_rel − ω×(ω×r') − dω/dt×r'      (dω/dt = 0 aquí)
   ===================================================================== */
const rad=d=>d*Math.PI/180;
const rotz=(v,th)=>{const c=Math.cos(th),s=Math.sin(th);return [c*v[0]-s*v[1],s*v[0]+c*v[1],v[2]];};

const Physics={
  // Términos ficticios. P.kC y P.kF (0 o 1) permiten apagarlos para comparar.
  terms(s,P){
    const W=P.Omega;
    // −2 ω×v  con ω=(0,0,Ω):  ω×v = (−Ω·vy, Ω·vx, 0)
    const cor=[2*W*s[4]*P.kC,-2*W*s[3]*P.kC,0];
    // −ω×(ω×r') = Ω²·(x, y, 0)  (apunta hacia afuera del eje)
    const cen=[W*W*s[0]*P.kF,W*W*s[1]*P.kF,0];
    return {cor,cen};
  },
  // Derivada del estado [x,y,z,vx,vy,vz]
  deriv(s,P){
    const t=this.terms(s,P);
    return [s[3],s[4],s[5],t.cor[0]+t.cen[0],t.cor[1]+t.cen[1],-P.g]; // gravedad en −Z
  },
  // Un paso de Runge-Kutta de 4.º orden
  rk4(s,h,P){
    const add=(y,k,c)=>y.map((v,i)=>v+k[i]*c);
    const k1=this.deriv(s,P),k2=this.deriv(add(s,k1,h/2),P),
          k3=this.deriv(add(s,k2,h/2),P),k4=this.deriv(add(s,k3,h),P);
    return s.map((v,i)=>v+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
  },
  // Constante de Jacobi (energía en el marco rotante): se conserva si Coriolis y centrífuga están activas
  jacobi(s,P){return .5*(s[3]*s[3]+s[4]*s[4]+s[5]*s[5])-.5*P.Omega*P.Omega*(s[0]*s[0]+s[1]*s[1])+P.g*s[2];}
};

/* =====================================================================
   2. INTERFAZ (controles)
   ===================================================================== */
const SL=[
 ["h","Plataforma"],
 ["Omega","ω velocidad angular",-3,3,.1,1,"rad/s",1],
 ["m","Masa m",.1,5,.1,1,"kg",1],
 ["h","Lanzamiento (visto desde la plataforma)"],
 ["v0","Rapidez inicial v₀",.5,12,.1,5,"m/s",1],
 ["alpha","Elevación α",0,80,1,35,"°",0],
 ["az","Dirección en el disco",-180,180,1,0,"°",0],
 ["r0","Radio de salida r₀",0,7,.1,0,"m",1],
 ["h","Entorno"],
 ["g","Gravedad g",0,9.81,.01,3,"m/s²",2],
 ["ts","Velocidad de la animación",.1,2,.05,.6,"×",2]
];
const $=id=>document.getElementById(id), val=id=>+$(id).value;
$("sliders").innerHTML=SL.map(s=>s[0]==="h"?`<h2>${s[1]}</h2>`:
  `<label>${s[1]}<output id="o_${s[0]}"></output><input type="range" id="${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${s[5]}"></label>`).join("");
SL.forEach(s=>{if(s[0]==="h")return;const e=$(s[0]),o=$("o_"+s[0]);
  const u=()=>{o.textContent=(+e.value).toFixed(s[7])+" "+s[6];if(s[0]==="az")aim.rotation.z=rad(+e.value)};
  e.addEventListener("input",u);e._u=u;});
if(innerWidth<760)$("det").open=false;

/* =====================================================================
   3. ESCENA 3D
   ===================================================================== */
const R=8; // radio de la plataforma (m)
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
$("stage").appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0f172a);
scene.fog=new THREE.Fog(0x0f172a,30,80);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
scene.add(new THREE.AmbientLight(0xffffff,.65));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(6,-8,14);scene.add(sun);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);
ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.495;ctl.maxDistance=60;

const lineMat=(c,o)=>new THREE.LineBasicMaterial({color:c,transparent:true,opacity:o});

// Referencia inercial: suelo cuadriculado y postes fijos en el espacio
const ref=new THREE.Group();scene.add(ref);
const grid=new THREE.GridHelper(40,40,0x334155,0x1e293b);grid.rotateX(Math.PI/2);grid.position.z=-.12;ref.add(grid);
for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2,g=new THREE.CylinderGeometry(i?.07:.14,i?.07:.14,i?1:1.6,10);g.rotateX(Math.PI/2);
  const p=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:i?0x64748b:0xfbbf24}));
  p.position.set((R+3)*Math.cos(a),(R+3)*Math.sin(a),i?.5:.8);ref.add(p);
}

// Plataforma giratoria (transparente) con anillos, radios y línea de apuntado
const platform=new THREE.Group();scene.add(platform);
const dg=new THREE.CylinderGeometry(R,R,.1,72);dg.rotateX(Math.PI/2);
const disk=new THREE.Mesh(dg,new THREE.MeshPhongMaterial({color:0x38bdf8,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));
disk.position.z=-.05;platform.add(disk);
for(let k=1;k<=4;k++){const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push(new THREE.Vector3(R*k/4*Math.cos(a),R*k/4*Math.sin(a),.02));}
  platform.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat(0x38bdf8,k===4?.8:.3)));}
const sp=[];for(let i=0;i<12;i++){const a=i/12*Math.PI*2;sp.push(new THREE.Vector3(0,0,.02),new THREE.Vector3(R*Math.cos(a),R*Math.sin(a),.02));}
platform.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(sp),lineMat(0x38bdf8,.22)));
const aim=new THREE.Group();platform.add(aim);
const aimLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,.04),new THREE.Vector3(R,0,.04)]),
  new THREE.LineDashedMaterial({color:0xe2e8f0,dashSize:.3,gapSize:.22}));aimLine.computeLineDistances();aim.add(aimLine);
const mark=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshPhongMaterial({color:0xf43f5e}));mark.position.set(R,0,.08);aim.add(mark);

// Proyectil, línea de caída y estela
const ball=new THREE.Mesh(new THREE.SphereGeometry(.22,24,16),new THREE.MeshStandardMaterial({color:0xf8fafc,emissive:0x38bdf8,emissiveIntensity:.5}));scene.add(ball);
const dropG=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
scene.add(new THREE.Line(dropG,lineMat(0x94a3b8,.5)));
const MAXP=2000,trG=new THREE.BufferGeometry();
trG.setAttribute("position",new THREE.BufferAttribute(new Float32Array(MAXP*3),3));trG.setDrawRange(0,0);
const trail=new THREE.Line(trG,new THREE.LineBasicMaterial({color:0x38bdf8}));trail.frustumCulled=false;scene.add(trail);

// Flechas de vectores en tiempo real
function mkArrow(c){const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,c,.35,.2);a.visible=false;scene.add(a);return a;}
const aV=mkArrow(0x38bdf8),aC=mkArrow(0xf97316),aF=mkArrow(0xfbbf24);
function setArrow(a,o,v,k,mx){
  const m=Math.hypot(v[0],v[1],v[2]);if(m<1e-6){a.visible=false;return;}
  const L=Math.min(mx,Math.max(.3,m*k));a.visible=true;a.position.set(o[0],o[1],o[2]);
  a.setDirection(new THREE.Vector3(v[0]/m,v[1]/m,v[2]/m));a.setLength(L,Math.min(.4,L*.4),Math.min(.22,L*.25));
}

/* =====================================================================
   4. ESTADO DE LA SIMULACIÓN Y BUCLE
   ===================================================================== */
let mode="rot",paused=false,acc=0,sim;
function params(){return {Omega:val("Omega"),g:val("g"),kC:$("kC").checked?1:0,kF:$("kF").checked?1:0};}
function idle(){const az=rad(val("az")),r0=val("r0");return [r0*Math.cos(az),r0*Math.sin(az),.1,0,0,0];}
function reset(){sim={launched:false,landed:false,out:false,t:0,n:0,theta:0,s:idle(),trR:[],trI:[],err:null,dJ:null,valid:true};}
function launch(){
  reset();const P=params(),a=rad(val("alpha")),z=rad(val("az")),v0=val("v0");
  const s=idle();s[3]=v0*Math.cos(a)*Math.cos(z);s[4]=v0*Math.cos(a)*Math.sin(z);s[5]=v0*Math.sin(a);
  sim.s=s;sim.launched=true;sim.P0=P;sim.J0=Physics.jacobi(s,P);
  // Condiciones iniciales en el marco inercial: v_in = v' + ω×r'
  sim.r0in=rotz(s,0);sim.v0in=[s[3]-P.Omega*s[1],s[4]+P.Omega*s[0],s[5]];
  paused=false;setPause();
}
function setPause(){$("bPause").setAttribute("aria-pressed",paused);$("bPause").textContent=paused?"Reanudar":"Pausar";}

function advance(h,P){
  sim.theta+=P.Omega*h;
  if(!sim.launched||sim.landed||sim.out)return;
  if(P.kC!==1||P.kF!==1||P.Omega!==sim.P0.Omega||P.g!==sim.P0.g)sim.valid=false;
  sim.s=Physics.rk4(sim.s,h,P);sim.t+=h;sim.n++;
  const s=sim.s;
  if(sim.n%4===0&&sim.trR.length<MAXP*3){sim.trR.push(s[0],s[1],s[2]);const q=rotz(s,sim.theta);sim.trI.push(q[0],q[1],q[2]);}
  if(sim.valid){
    // Verificación: trayectoria inercial analítica (recta + parábola) vs. la integrada en el marco rotante
    const t=sim.t,r=rotz(s,sim.theta),r0=sim.r0in,v0=sim.v0in;
    sim.err=Math.hypot(r[0]-(r0[0]+v0[0]*t),r[1]-(r0[1]+v0[1]*t),r[2]-(r0[2]+v0[2]*t-.5*P.g*t*t));
    sim.dJ=Math.abs(Physics.jacobi(s,P)-sim.J0);
  }
  if(s[2]<=0){s[2]=0;sim.landed=true;}
  else if(sim.t>40||Math.hypot(s[0],s[1])>R*4)sim.out=true;
}

function camPreset(){
  const az=rad(val("az"));
  if(mode==="rot"){cam.position.set(-(R+2.5)*Math.cos(az),-(R+2.5)*Math.sin(az),2.8);ctl.target.set(.35*R*Math.cos(az),.35*R*Math.sin(az),.6);}
  else{cam.position.set(R*1.7,-R*1.7,R*1.15);ctl.target.set(0,0,0);}
  ctl.update();
}
function setMode(m){
  mode=m;$("mRot").setAttribute("aria-pressed",m==="rot");$("mIn").setAttribute("aria-pressed",m==="in");
  $("hint").textContent=m==="rot"
   ?"Cámara co-rotante: la plataforma está quieta y el mundo gira. Aquí aparecen las fuerzas ficticias que curvan la trayectoria."
   :"Cámara inercial: la plataforma gira bajo el proyectil, que viaja en línea recta (horizontalmente). No hay fuerzas ficticias.";
  camPreset();
}

function render(P){
  const inr=mode==="in",th=sim.theta,s=sim.s;
  platform.rotation.z=inr?th:0;ref.rotation.z=inr?0:-th;
  const pr=[s[0],s[1],s[2]],pos=inr?rotz(pr,th):pr;
  ball.position.set(pos[0],pos[1],pos[2]);
  const dp=dropG.attributes.position;dp.setXYZ(0,pos[0],pos[1],pos[2]);dp.setXYZ(1,pos[0],pos[1],0);dp.needsUpdate=true;
  // Velocidad relativa (en vista rotante) o inercial v_in = v' + ω×r' (en vista inercial)
  let vr=[s[3],s[4],s[5]];
  if(!sim.launched){const a=rad(val("alpha")),z=rad(val("az")),v0=val("v0");vr=[v0*Math.cos(a)*Math.cos(z),v0*Math.cos(a)*Math.sin(z),v0*Math.sin(a)];}
  const vin=[vr[0]-P.Omega*s[1],vr[1]+P.Omega*s[0],vr[2]];
  setArrow(aV,pos,inr?rotz(vin,th):vr,.35,4.5);
  const fly=sim.launched&&!sim.landed&&!sim.out&&!inr;
  if(fly){const T=Physics.terms(s,P);
    P.kC?setArrow(aC,pos,T.cor,.25,5):aC.visible=false;
    P.kF?setArrow(aF,pos,T.cen,.25,5):aF.visible=false;}
  else{aC.visible=false;aF.visible=false;}
  // Estela del marco actual
  const arr=inr?sim.trI:sim.trR,pa=trG.attributes.position;
  pa.array.set(arr);pa.needsUpdate=true;trG.setDrawRange(0,arr.length/3);
  // Lecturas
  const m=val("m"),vh=Math.hypot(s[3],s[4]),rh=Math.hypot(s[0],s[1]);
  const aCor=2*Math.abs(P.Omega)*vh*P.kC,aCen=P.Omega*P.Omega*rh*P.kF;
  const st=!sim.launched?"Listo":sim.landed?"Aterrizó":sim.out?"Fuera de alcance":"En vuelo";
  const ok=sim.launched&&sim.valid&&sim.err!==null;
  const rows=[["Estado",st],["Tiempo",sim.t.toFixed(2)+" s"],["|v_rel|",Math.hypot(s[3],s[4],s[5]).toFixed(2)+" m/s"],
   ["a Coriolis",aCor.toFixed(2)+" m/s²"],["a centrífuga",aCen.toFixed(2)+" m/s²"],
   ["F Coriolis",(m*aCor).toFixed(2)+" N"],["F centrífuga",(m*aCen).toFixed(2)+" N"],
   ["Error inercial",ok?(sim.err*1000).toExponential(1)+" mm":"n/a"],["ΔJacobi",ok?sim.dJ.toExponential(1):"n/a"]];
  $("kv").innerHTML=rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join("");
}

/* Calculadora en la Tierra: a = 2 Ω_T v sen φ (componente horizontal) */
function earth(){
  const OT=7.292e-5,la=+$("eLat").value,v=+$("eV").value,a=2*OT*v*Math.sin(rad(la));
  $("eOut").innerHTML=`<span>a Coriolis</span><span>${Math.abs(a).toExponential(2)} m/s²</span><span>Desvío</span><span>${a===0?"ninguno":a>0?"derecha":"izquierda"}</span>`;
}
$("eLat").addEventListener("input",earth);$("eV").addEventListener("input",earth);earth();

/* Eventos */
$("bFire").onclick=launch;
$("bPause").onclick=()=>{paused=!paused;setPause();};
$("bReset").onclick=()=>{reset();paused=false;setPause();};
$("bFlip").onclick=()=>{const e=$("Omega");e.value=-e.value;e._u();};
$("mRot").onclick=()=>setMode("rot");$("mIn").onclick=()=>setMode("in");
SL.forEach(s=>{if(s[0]!=="h")$(s[0])._u();});
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener("resize",resize);resize();

reset();setMode("rot");
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const P=params();
  if(!sim.launched)sim.s=idle();
  if(!paused){const h=1/240;acc+=dt*val("ts");while(acc>=h){advance(h,P);acc-=h;}}
  ctl.update();render(P);renderer.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
